<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSheet-AI · 运营看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .menu-active { background: #E8F3FF; color: #1677FF; border-left: 3px solid #1677FF; }
    .menu-item:hover { background: #F5F7FA; }
    .menu-item.active { background: #E8F3FF; color: #1677FF; }
  </style>
</head>
<body class="font-sans text-sm text-[#1F2329] bg-[#F5F7FA] min-h-screen">

<div class="flex min-h-screen">
  <!-- 左侧菜单栏 -->
  <aside class="w-60 bg-white border-r border-[#E5E6EB] flex flex-col shrink-0 fixed h-full">
    <div class="h-14 flex items-center px-4 gap-2 border-b border-[#E5E6EB]">
      <div class="w-8 h-8 bg-[#1677FF] rounded-md flex items-center justify-center text-white text-xs font-bold">S</div>
      <span class="font-medium">SmartSheet-AI</span>
    </div>
    <nav class="flex-1 overflow-y-auto py-2">
      <div class="px-3 space-y-1">
        <a href="index.html" class="menu-item block px-3 py-2 rounded-md text-[13px] flex items-center gap-2 text-[#86909C]">
          <span>📋</span> 台账列表
        </a>
        <a href="ai_form.html" class="menu-item block px-3 py-2 rounded-md text-[13px] flex items-center gap-2 text-[#86909C]">
          <span>✨</span> AI填单
        </a>
        <a href="dashboard.html" class="menu-active block px-3 py-2 rounded-md font-medium text-[13px] flex items-center gap-2">
          <span>📈</span> 数据看板
        </a>
      </div>
    </nav>
    <div class="h-14 border-t border-[#E5E6EB] flex items-center px-4 gap-2">
      <div class="w-8 h-8 rounded-full bg-[#1677FF] text-white flex items-center justify-center text-xs">张</div>
      <span class="text-[13px] text-[#86909C]">张三 · 管理员</span>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="flex-1 ml-60 p-6 space-y-5">
    <!-- 自然语言查询 -->
    <section class="text-center">
      <div class="w-full max-w-3xl mx-auto bg-white border-2 border-[#1677FF]/30 focus-within:border-[#1677FF] rounded-xl px-4 py-3 shadow-sm flex items-center gap-3 transition-colors">
        <input id="nl-input" type="text" placeholder="试试问：上个月各品名的进货金额占比" class="flex-1 text-[13px] focus:outline-none bg-transparent">
        <button id="btn-send" onclick="runQuery()" class="w-9 h-9 bg-[#1677FF] hover:bg-[#4096FF] text-white rounded-lg flex items-center justify-center transition-colors shrink-0">→</button>
      </div>
      <div class="flex flex-wrap justify-center gap-2 mt-3 max-w-3xl mx-auto">
        <button onclick="fillChip('上个月各品名进货金额占比')" class="border border-[#E5E6EB] hover:border-[#1677FF] hover:text-[#1677FF] rounded-full px-3 py-1 text-[13px] transition-colors">上个月各品名进货金额占比</button>
        <button onclick="fillChip('近 30 天入库数量趋势')" class="border border-[#E5E6EB] hover:border-[#1677FF] hover:text-[#1677FF] rounded-full px-3 py-1 text-[13px] transition-colors">近 30 天入库数量趋势</button>
        <button onclick="fillChip('供应商进货次数排行')" class="border border-[#E5E6EB] hover:border-[#1677FF] hover:text-[#1677FF] rounded-full px-3 py-1 text-[13px] transition-colors">供应商进货次数排行</button>
      </div>
    </section>

    <!-- 查询方案摘要条 -->
    <section id="query-summary" class="hidden bg-white border border-[#E5E6EB] rounded-lg px-4 py-3 flex items-center justify-between">
      <p class="text-[13px]" id="summary-text">📊 查询方案：数据源=进货台账 · 时间范围=2026-08 · 分组维度=品名 · 统计=金额求和</p>
      <div class="flex items-center gap-3 shrink-0 ml-4">
        <button onclick="confirmQuery()" class="bg-[#1677FF] hover:bg-[#4096FF] text-white rounded-md px-3 py-1.5 text-[13px] transition-colors">确认查询</button>
        <button class="text-[#1677FF] hover:underline text-[13px]">修改</button>
      </div>
    </section>

    <!-- 图表工具栏 -->
    <section class="flex items-center justify-between">
      <div class="flex bg-[#F5F7FA] rounded-lg p-1 gap-1">
        <button onclick="switchChart('line')" id="btn-line" class="chart-btn text-[#4E5969] rounded-md px-3 py-1.5 text-[13px] transition-colors hover:text-[#1677FF]">📈 折线图</button>
        <button onclick="switchChart('bar')" id="btn-bar" class="chart-btn bg-white shadow text-[#1677FF] rounded-md px-3 py-1.5 text-[13px]">📊 柱状图</button>
        <button onclick="switchChart('pie')" id="btn-pie" class="chart-btn text-[#4E5969] rounded-md px-3 py-1.5 text-[13px] transition-colors hover:text-[#1677FF]">🥧 饼图</button>
      </div>
      <div class="flex items-center gap-3">
        <select class="border border-[#E5E6EB] hover:border-[#1677FF] rounded-md px-3 py-1.5 text-[13px] focus:outline-none focus:border-[#1677FF] transition-colors">
          <option>近 7 天</option>
          <option>近 30 天</option>
          <option>本月</option>
          <option selected>上月</option>
        </select>
        <select class="border border-[#E5E6EB] hover:border-[#1677FF] rounded-md px-3 py-1.5 text-[13px] focus:outline-none focus:border-[#1677FF] transition-colors">
          <option selected>进货台账</option>
          <option>销售台账</option>
        </select>
      </div>
    </section>

    <!-- 图表区 2×2 网格 -->
    <section class="grid grid-cols-3 gap-4">
      <!-- 主图表 -->
      <div class="col-span-2 bg-white rounded-lg p-4 shadow-sm border border-[#E5E6EB]">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-medium" id="chart-title">各品名进货金额（2026-08）</h3>
          <button class="text-[#86909C] hover:text-[#1F2329] text-lg">···</button>
        </div>
        <div class="h-72">
          <canvas id="main-chart"></canvas>
        </div>
      </div>

      <!-- 3 个数字卡 -->
      <div class="space-y-4">
        <div class="bg-white rounded-lg p-5 shadow-sm border border-[#E5E6EB] hover:shadow-md transition-shadow">
          <p class="text-[13px] text-[#86909C] mb-1">本月进货总额</p>
          <p class="text-3xl font-bold text-[#1F2329]">¥128,400</p>
          <p class="text-[13px] mt-2"><span class="text-[#52C41A]">↑ +12.5%</span> <span class="text-[#86909C]">较上月</span></p>
        </div>
        <div class="bg-white rounded-lg p-5 shadow-sm border border-[#E5E6EB] hover:shadow-md transition-shadow">
          <p class="text-[13px] text-[#86909C] mb-1">本月入库笔数</p>
          <p class="text-3xl font-bold text-[#1F2329]">46</p>
          <p class="text-[13px] mt-2"><span class="text-[#FF4D4F]">↓ -3</span> <span class="text-[#86909C]">较上月</span></p>
        </div>
        <div class="bg-white rounded-lg p-5 shadow-sm border border-[#E5E6EB] hover:shadow-md transition-shadow">
          <p class="text-[13px] text-[#86909C] mb-1">供应商数量</p>
          <p class="text-3xl font-bold text-[#1F2329]">18</p>
          <p class="text-[13px] mt-2"><span class="text-[#86909C]">— 持平</span></p>
        </div>
      </div>
    </section>

    <!-- AI 结论摘要 -->
    <section class="bg-[#F5F7FA] rounded-lg px-4 py-3 text-[13px] text-[#4E5969]">
      🍎 苹果占本月进货金额 42%，环比上升 8 个百分点
    </section>
  </main>
</div>

<script>
  const chartData = {
    labels: ['苹果', '笔记本电脑', '办公椅', '打印纸', '显示器', '其他'],
    values: [54000, 22500, 7600, 1400, 10392, 32108]
  };

  const colors = ['#1677FF', '#52C41A', '#FAAD14', '#722ED1', '#13C2C2', '#86909C'];
  let currentType = 'bar';
  let chartInstance = null;

  function createChart(type) {
    const ctx = document.getElementById('main-chart').getContext('2d');
    if (chartInstance) chartInstance.destroy();

    const config = {
      type: type === 'pie' ? 'pie' : type,
      data: {
        labels: chartData.labels,
        datasets: [{
          label: '进货金额（元）',
          data: chartData.values,
          backgroundColor: type === 'pie' ? colors : '#1677FF',
          borderColor: type === 'line' ? '#1677FF' : undefined,
          borderWidth: type === 'line' ? 2 : 0,
          fill: type === 'line',
          tension: 0.3,
          borderRadius: type === 'bar' ? 4 : 0,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: type === 'pie', position: 'right', labels: { font: { size: 12 } } }
        },
        scales: type !== 'pie' ? {
          y: {
            beginAtZero: true,
            ticks: { callback: v => '¥' + v.toLocaleString(), font: { size: 11 } },
            grid: { color: '#E5E6EB' }
          },
          x: {
            ticks: { font: { size: 11 } },
            grid: { display: false }
          }
        } : {}
      }
    };

    chartInstance = new Chart(ctx, config);
  }

  function switchChart(type) {
    currentType = type;
    document.querySelectorAll('.chart-btn').forEach(btn => {
      btn.className = 'chart-btn text-[#4E5969] rounded-md px-3 py-1.5 text-[13px] transition-colors hover:text-[#1677FF]';
    });
    const activeBtn = document.getElementById('btn-' + type);
    activeBtn.className = 'chart-btn bg-white shadow text-[#1677FF] rounded-md px-3 py-1.5 text-[13px]';
    createChart(type);
  }

  function fillChip(text) {
    document.getElementById('nl-input').value = text;
    runQuery();
  }

  function runQuery() {
    const val = document.getElementById('nl-input').value.trim();
    if (!val) return;
    document.getElementById('query-summary').classList.remove('hidden');
    if (val.includes('趋势')) {
      document.getElementById('summary-text').textContent = '📊 查询方案：数据源=进货台账 · 时间范围=近30天 · 分组维度=日期 · 统计=数量求和';
      document.getElementById('chart-title').textContent = '近 30 天入库数量趋势';
      switchChart('line');
    } else if (val.includes('供应商')) {
      document.getElementById('summary-text').textContent = '📊 查询方案：数据源=进货台账 · 时间范围=2026-08 · 分组维度=供应商 · 统计=次数计数';
      document.getElementById('chart-title').textContent = '供应商进货次数排行';
      switchChart('bar');
    } else {
      document.getElementById('summary-text').textContent = '📊 查询方案：数据源=进货台账 · 时间范围=2026-08 · 分组维度=品名 · 统计=金额求和';
      document.getElementById('chart-title').textContent = '各品名进货金额占比（2026-08）';
      switchChart('pie');
    }
  }

  function confirmQuery() {
    document.getElementById('query-summary').classList.add('border-[#1677FF]');
    setTimeout(() => document.getElementById('query-summary').classList.remove('border-[#1677FF]'), 600);
  }

  createChart('bar');
</script>
</body>
</html>
